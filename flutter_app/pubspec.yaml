name: earnplus
description: "EarnPlus — earn coins from tasks, spins, check-ins and redeem real money."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Networking / models
  http: ^1.2.2
  # Secure token storage
  flutter_secure_storage: ^9.2.2
  # State management
  provider: ^6.1.2
  # Google Sign-In
  google_sign_in: ^6.2.1
  # Offerwall tasks
  webview_flutter: ^4.10.0
  # Ads — real AdMob network
  google_mobile_ads: ^5.3.1
  # Ads — real Unity Ads network
  unity_ads_plugin: ^0.3.0
  # Push — dependency present but NEVER initialized without Firebase setup
  firebase_messaging: ^15.2.6
  # Referral share
  share_plus: ^10.1.4
  # KYC document photos (gallery / camera)
  image_picker: ^1.1.2
  # Misc
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  fake_async: ^1.3.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0B7A3E"
  image: "assets/icon/app_icon.png"
  android: true
  ios: true
  android_12:
    color: "#0B7A3E"
    image: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
